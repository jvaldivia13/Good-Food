<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Food-Good · Restaurante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="logo">Food-Good<small>Sistema de Comandas</small></div>
      <p class="muted" style="font-size:13px;margin-bottom:4px;">Ingresa tu PIN de acceso</p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" />
      <div class="pin-pad" id="pinPad"></div>
      <button id="loginBtn" class="btn btn-primary btn-block mt">Ingresar</button>
      <button id="cancelBtn" class="btn btn-ghost btn-block mt" style="margin-top:8px;">Cancelar</button>
      <p id="loginError" class="muted center" style="color:var(--danger);font-size:13px;min-height:18px;margin:8px 0 0;"></p>
      <div class="center mt" style="font-size:11px;color:var(--neutral-500);">
        PINs demo — admin: <b>2222</b> · mozo: <b>3333</b> · cocina: <b>5555</b> · cajero: <b>4444</b>
      </div>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div id="appView" class="app hidden">
    <div class="topbar">
      <span class="brand">Food-Good</span>
      <span id="roleChip" class="role-chip"></span>
      <div class="spacer"></div>
      <!-- Acciones de topbar por rol -->
      <button id="topbarAction" class="btn btn-primary mini hidden"></button>
      <button id="logoutBtn" class="btn btn-ghost mini">Salir</button>
    </div>

    <main class="main">
      <!-- ===== MOZO: mapa de mesas ===== -->
      <section id="view-waiter" class="view">
        <div class="area-tabs" id="areaTabs"></div>
        <div class="tables-grid" id="tablesGrid"></div>
      </section>

      <!-- ===== MOZO: comanda actual ===== -->
      <section id="view-command" class="view">
        <div id="commandHeader"></div>
        <div id="commandBody"></div>
      </section>

      <!-- ===== KITCHEN: KDS kanban ===== -->
      <section id="view-kitchen" class="view">
        <div class="area-tabs" id="stationTabs"></div>
        <div class="kds-board" id="kdsBoard"></div>
      </section>

      <!-- ===== CASHIER / ADMIN órdenes ===== -->
      <section id="view-orders" class="view">
        <h3 class="section-title">Órdenes activas</h3>
        <div id="ordersList"></div>
      </section>

      <!-- ===== ADMIN: menú ===== -->
      <section id="view-menu" class="view">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">Menú</h3>
          <button id="addProductBtn" class="btn btn-primary mini">+ Producto</button>
        </div>
        <div class="cat-tabs" id="menuCatTabs"></div>
        <div class="prod-grid" id="menuGrid"></div>
      </section>

      <!-- ===== ADMIN: dashboard ===== -->
      <section id="view-dashboard" class="view">
        <div class="kpi-grid" id="kpiGrid"></div>
        <div class="card"><h3>Ventas por hora</h3><div id="hourChart"></div></div>
        <div class="card"><h3>Top productos</h3><div id="topProducts"></div></div>
      </section>
    </main>

    <!-- ===== NAVEGACIÓN INFERIOR (según rol) ===== -->
    <nav class="bottomnav" id="bottomNav"></nav>
  </div>

  <!-- ===== MODAL CONTENEDOR ===== -->
  <div id="modalContainer"></div>

  <!-- ===== TOASTS ===== -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/waiter.js"></script>
  <script src="/js/kitchen.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
